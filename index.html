<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>山村学園高校サッカー部 × WALPASS アスリート向け弁当</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Oswald:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-purple: #3b0764;
      --accent-purple: #6b21a8;
      --accent-red: #e11d48;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-sub: #64748b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans JP', sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      padding-bottom: 60px;
      -webkit-font-smoothing: antialiased;
    }

    /* 山村学園カラー（紫グラデーション）ヘッダー */
    header {
      background: linear-gradient(150deg, #32075a 0%, #4c1d95 40%, #6b21a8 80%, #7e22ce 100%);
      text-align: center;
      padding: 24px 16px 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.12);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    /* ロゴ配置エリア */
    .logo-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 14px;
    }
    .emblem-box {
      width: 54px;
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.3));
    }
    .emblem-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .walpass-box {
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.25));
    }
    .walpass-img {
      height: 100%;
      width: auto;
      object-fit: contain;
    }
    .collab-cross {
      font-size: 15px;
      color: rgba(255,255,255,0.85);
      font-weight: 700;
      text-shadow: 0 1px 3px rgba(0,0,0,0.4);
    }

    /* タイトル群（クッキリ白文字） */
    .main-title {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 1.2px;
      color: #ffffff;
      margin-bottom: 4px;
      text-shadow: 0 2px 6px rgba(0,0,0,0.35);
    }
    .sub-title-en {
      font-family: 'Oswald', sans-serif;
      font-size: 13px;
      letter-spacing: 2.5px;
      color: rgba(255, 255, 255, 0.85);
      text-transform: uppercase;
      font-weight: 600;
      text-shadow: 0 1px 3px rgba(0,0,0,0.3);
    }

    /* 月選択フィルター（タブ） */
    .filter-wrapper {
      max-width: 500px;
      margin: 16px auto 8px;
      padding: 0 16px;
      overflow-x: auto;
      white-space: nowrap;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .filter-wrapper::-webkit-scrollbar { display: none; }
    .filter-tabs {
      display: inline-flex;
      gap: 8px;
      background: #e2e8f0;
      padding: 4px;
      border-radius: 30px;
    }
    .tab-btn {
      border: none;
      background: transparent;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      color: #475569;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: #ffffff;
      color: var(--primary-purple);
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }

    /* メインコンテナ */
    .container {
      max-width: 500px;
      margin: 0 auto;
      padding: 8px 16px;
    }

    /* ローディング状態 */
    .loading-state {
      text-align: center;
      padding: 80px 20px;
      color: var(--text-sub);
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #cbd5e1;
      border-top-color: var(--accent-purple);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* お弁当カード */
    .bento-card {
      background: var(--card-bg);
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 24px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.05);
      border: 1px solid #f1f5f9;
    }
    .card-header {
      padding: 12px 18px;
      background: #ffffff;
      border-bottom: 1px solid #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .card-date {
      font-size: 16px;
      font-weight: 700;
      color: var(--primary-purple);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge {
      font-size: 10px;
      background: #faf5ff;
      color: var(--accent-purple);
      padding: 3px 8px;
      border-radius: 12px;
      font-weight: 700;
      border: 1px solid #e9d5ff;
    }
    .image-box {
      width: 100%;
      background: #f1f5f9;
      cursor: zoom-in;
    }
    .bento-img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
      max-height: 480px;
    }

    /* メニュー表示部 */
    .menu-box {
      padding: 18px;
    }
    .menu-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-sub);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      letter-spacing: 0.5px;
    }
    .menu-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .menu-item {
      font-size: 14.5px;
      color: var(--text-main);
      line-height: 1.45;
      display: flex;
      align-items: baseline;
      gap: 8px;
    }
    .bullet {
      color: var(--accent-purple);
      font-size: 10px;
      flex-shrink: 0;
    }

    /* 写真拡大モーダル */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.92);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .modal.open { display: flex; }
    .modal-img {
      max-width: 100%;
      max-height: 90vh;
      object-fit: contain;
      border-radius: 8px;
    }
    .close-btn {
      position: absolute;
      top: 20px; right: 20px;
      color: #fff;
      font-size: 32px;
      cursor: pointer;
      line-height: 1;
    }
  </style>
</head>
<body>

  <header>
    <!-- ロゴ並びエリア -->
    <div class="logo-container">
      <div class="emblem-box">
        <img src="https://lh3.googleusercontent.com/d/1sBzp1_VYqg6jYyBi2lNwABHL-mHm52wW" alt="山村学園FC エンブレム" class="emblem-img">
      </div>
      <span class="collab-cross">✕</span>
      <div class="walpass-box">
        <img src="https://lh3.googleusercontent.com/d/1ocIJjyuDiOk6fBSxdT1vCEHuUENlZweg" alt="WALPASS ロゴ" class="walpass-img">
      </div>
    </div>

    <!-- クッキリ白文字タイトル -->
    <h1 class="main-title">アスリート向け弁当</h1>
    <div class="sub-title-en">Bento Boxes for Athletes</div>
  </header>

  <!-- 月選択フィルター -->
  <div class="filter-wrapper">
    <div class="filter-tabs" id="filterTabs">
      <!-- JavaScriptで動的生成 -->
    </div>
  </div>

  <main class="container">
    <div id="loading" class="loading-state">
      <div class="spinner"></div>
      <p>最新のお弁当記録を読み込み中...</p>
    </div>
    <div id="bentoContainer"></div>
  </main>

  <!-- 写真拡大モーダル -->
  <div id="imageModal" class="modal" onclick="closeModal()">
    <span class="close-btn">&times;</span>
    <img id="modalImg" class="modal-img" src="" alt="拡大写真">
  </div>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzKy_3506QxE_eRY9MRbO2JEjxnNHQ9wfoyBpy5PK5iS_Zi2rEMJDzUXYtMu5dCCQw/exec";

    let allBentoData = [];
    let activeMonth = "すべて";

    // JSONPコールバック関数
    window.handleBentoData = function(data) {
      if (Array.isArray(data)) {
        allBentoData = data;
        renderFilters();
        renderBentoList();
      } else {
        showError();
      }
    };

    // JSONP方式でデータを取得
    function fetchBentoData() {
      const script = document.createElement("script");
      script.src = `${GAS_API_URL}?callback=handleBentoData&t=${new Date().getTime()}`;
      script.onerror = function() {
        showError();
      };
      document.body.appendChild(script);
    }

    function showError() {
      document.getElementById("loading").innerHTML = `
        <p style="color:#ef4444;">データの読み込みに失敗しました。<br>GAS側のデプロイを確認してください。</p>
      `;
    }

    // 月選択タブの生成
    function renderFilters() {
      const months = ["すべて"];
      allBentoData.forEach(item => {
        if (item.yearMonth && !months.includes(item.yearMonth)) {
          months.push(item.yearMonth);
        }
      });

      const tabsHtml = months.map(month => `
        <button class="tab-btn ${month === activeMonth ? 'active' : ''}" onclick="selectMonth('${month}')">
          ${month}
        </button>
      `).join('');

      document.getElementById("filterTabs").innerHTML = tabsHtml;
    }

    // 月の切り替え
    function selectMonth(month) {
      activeMonth = month;
      renderFilters();
      renderBentoList();
    }

    // お弁当カードの描画
    function renderBentoList() {
      document.getElementById("loading").style.display = "none";
      const container = document.getElementById("bentoContainer");

      const filtered = activeMonth === "すべて" 
        ? allBentoData 
        : allBentoData.filter(item => item.yearMonth === activeMonth);

      if (filtered.length === 0) {
        container.innerHTML = `
          <div style="text-align:center; padding:60px 20px; color:#64748b;">
            <p>この月のお弁当記録はありません</p>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(item => `
        <article class="bento-card">
          <div class="card-header">
            <div class="card-date">
              <span>🍱</span> ${item.date}
            </div>
            <span class="badge">WALPASS提供</span>
          </div>
          <div class="image-box" onclick="openModal('${item.imageUrl}')">
            <img src="${item.imageUrl}" alt="${item.date}のお弁当" class="bento-img" loading="lazy">
          </div>
          <div class="menu-box">
            <div class="menu-title">📋 本日のメニュー</div>
            <ul class="menu-list">
              ${item.menu.length > 0 ? item.menu.map(m => `
                <li class="menu-item"><span class="bullet">●</span><span>${m}</span></li>
              `).join('') : `
                <li class="menu-item" style="color:#94a3b8;">メニュー登録なし</li>
              `}
            </ul>
          </div>
        </article>
      `).join('');
    }

    // モーダル操作
    function openModal(imgUrl) {
      document.getElementById("modalImg").src = imgUrl;
      document.getElementById("imageModal").classList.add("open");
    }
    function closeModal() {
      document.getElementById("imageModal").classList.remove("open");
    }

    // 初期実行
    fetchBentoData();
  </script>
</body>
</html>
